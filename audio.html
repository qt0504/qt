    <!-- 内部js文件 -->
    <script>

        // DOM加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            // B站卡片点击效果和跳转逻辑
            document.querySelectorAll('.card').forEach(card => {
                card.addEventListener('click', function() {
                    // 点击效果
                    this.style.transform = 'scale(0.98)';
                    setTimeout(() => {
                        this.style.transform = '';
                    }, 200);
                    
                    // 获取平台和视频ID
                    const platform = this.getAttribute('data-platform');
                    const bvid = this.getAttribute('data-bvid');
                    const weiboId = this.getAttribute('data-weibo-id');
                    
                    // 根据平台跳转到对应视频
                    if (platform === 'bilibili' && bvid) {
                        window.open(`https://www.bilibili.com/video/${bvid}`, '_blank');
                    } else if (platform === 'weibo' && weiboId) {
                        window.open(`https://weibo.com/tv/show/1034:${weiboId}`, '_blank');
                    }
                });
            });

            // 喜马拉雅卡片：点击跳转到 data-url 指定的页面
            document.querySelectorAll('.card[data-platform="ximalaya"]').forEach(card => {
                card.style.cursor = 'pointer';
                card.addEventListener('click', (e) => {
                    // 防止点击内部 iframe 或 a 标签时误触发（目前没有内嵌元素，但保留好习惯）
                    if (e.target.closest('a')) return;
                    const targetUrl = card.getAttribute('data-url');
                    if (targetUrl) {
                        window.open(targetUrl, '_blank');
                    }
                });
            });

        });

    </script>
