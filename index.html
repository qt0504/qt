<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>首页</title>
    <!-- 引入外部 CSS 和 JavaScript (HTML、CSS、JS 完全分离) -->
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>

    <style>
    /* 仅首页卡片在手机上的优化 */
        @media screen and (max-width: 600px) {
            body#page-home .card {
                width: 90%;
                max-width: 380px;
                padding: 35px 20px;
            }
            body#page-home .card br {
                display: none;  /* 让br失效 */
            }
            body#page-home .card div[style*="font-family"] {
                font-size: 1.15rem !important;
                line-height: 2.1 !important;
                text-align: left;
                white-space: normal;
            }
        }
    </style>

</head>
<body id="page-home">
    <!-- 统一头部：左侧图标 + 导航居中 -->
    <header class="site-header">
        <div class="container header-inner">
            <div class="logo-icon">
                <!-- <span class="icon">🧡</span> -->
                <span class="logo-text">卿涛</span>
            </div>
            <nav class="main-nav">
                <a href="index.html" class="nav-link" data-page="home">首页</a>
                <a href="video.html" class="nav-link" data-page="video">视频</a>
                <a href="book.html" class="nav-link" data-page="book">图书</a>
                <a href="edit.html" class="nav-link" data-page="edit">剪辑</a>          
                <a href="audio.html" class="nav-link" data-page="audio">音频</a>
            </nav>
            <div class="header-right" aria-hidden="true"></div>
        </div>
    </header>

    <!-- 每个页面独立内容区，容器统一 -->
    <main class="main-content container">
        <div class="page-header">
            <!-- <h1 class="page-title" style="font-size: 1.8rem; color: #9f7a70;">🏠 首页</h1> -->
            <!-- <p class="page-desc">自留地，还在建设中……</p> -->
        </div>
        
        <!-- 卡片区域：单独居中 -->
        <div style="display: flex; justify-content: center; align-items: center; margin-top: 20px;">
            <div class="card" style="max-width: 650px; width: 100%; text-align: center; padding: 40px;">
                <div style="font-size: 1.3rem; line-height: 2.2; font-family: 'KaiTi', serif; color: #4a3a35; margin-top: 16px;">
                    王子猷居山阴，夜大雪，眠觉，开室，命酌酒。<br>
                    四望皎然，因起仿偟，咏左思《招隐诗》。<br>
                    忽忆戴安道，时戴在剡，即便夜乘小船就之。<br>
                    经宿方至，造门不前而返。<br>
                    人问其故，王曰：<br>
                    “吾本乘兴而行，兴尽而返，何必见戴？”
                </div>
                <p style="margin-top: 30px; color: #a97a6e;">—— 《世说新语·任诞》·雪夜</p>
            </div>
        </div>

    </main>

    <!-- 统一底部，所有页面一致 -->
    <footer class="site-footer">
        <div class="container footer-inner">
            <p class="footer-meta">卿涛 © 2026 | 仅供交流使用，视频版权归原作者所有</p>
            <p>联系：15235513525@163.com</p>
        </div>
    </footer>
</body>
</html>
